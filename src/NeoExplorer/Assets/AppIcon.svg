<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E6FD9"/>
      <stop offset="1" stop-color="#0B3E9C"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#A6D6FF" stop-opacity="0.94"/>
      <stop offset="0.45" stop-color="#5DAEF7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2B82EA" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1A74E0"/>
      <stop offset="1" stop-color="#0846B0"/>
    </linearGradient>
    <linearGradient id="drawerRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE2FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2E8EF2" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#062A6B" flood-opacity="0.35"/>
    </filter>
    <filter id="drawerShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="#052A6E" flood-opacity="0.5"/>
    </filter>
    <clipPath id="frontClip">
      <path d="M0 64 a14 14 0 0 1 14 -14 H96 l14 -10 H242 a14 14 0 0 1 14 14 V242 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 Z"/>
    </clipPath>
  </defs>

  <g transform="translate(8 6) scale(0.9375)">
  <!-- back of folder with tab -->
  <path d="M0 38 a18 18 0 0 1 18 -18 H76 a18 18 0 0 1 12 4.6 L106 40 H238 a18 18 0 0 1 18 18 V242 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 Z" fill="url(#back)"/>

  <g filter="url(#shadow)">
    <!-- glassy front panel -->
    <path d="M0 64 a14 14 0 0 1 14 -14 H96 l14 -10 H242 a14 14 0 0 1 14 14 V242 a14 14 0 0 1 -14 14 H14 a14 14 0 0 1 -14 -14 Z" fill="url(#front)"/>
  </g>
  <g clip-path="url(#frontClip)">
    <rect width="256" height="256" fill="url(#glow)"/>
    <!-- upper sheen band -->
    <path d="M0 50 H256 V118 C180 104 90 108 0 132 Z" fill="url(#sheen)"/>
  </g>
  <!-- glass rim highlight -->
  <path d="M1.5 64 a12.5 12.5 0 0 1 12.5 -12.5 H96.5 l14 -10 H242 a12.5 12.5 0 0 1 12.5 12.5 V242 a12.5 12.5 0 0 1 -12.5 12.5 H14 a12.5 12.5 0 0 1 -12.5 -12.5 Z" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- frosted drawer -->
  <g filter="url(#drawerShadow)">
    <path d="M44 256 V200 a28 28 0 0 1 28 -28 H184 a28 28 0 0 1 28 28 V256 Z" fill="url(#drawer)"/>
  </g>
  <path d="M45.5 256 V200 a26.5 26.5 0 0 1 26.5 -26.5 H184 a26.5 26.5 0 0 1 26.5 26.5 V256" fill="none" stroke="url(#drawerRim)" stroke-width="3"/>
  <rect x="76" y="204" width="104" height="9" rx="4.5" fill="#06347F"/>
  </g>
</svg>
